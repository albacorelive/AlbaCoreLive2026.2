const firebaseConfig = {
  apiKey: "INSERISCI_LA_TUA_API_KEY",              // Firebase > Impostazioni progetto > Le tue app
  authDomain: "albacorelive.firebaseapp.com",
  databaseURL: "https://albacorelive-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "albacorelive"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userId = null, userUniqueId = "", nicknameUtente = "Ospite";
let accountAttivo = false, isAdmin = false, hasVoice = false, canBypassGps = false;
let peer = null, myStream = null, originalAudioTrack = null, processedStream = null;
let audioCtx = null, sourceNode = null, biquadFilter = null, distortionNode = null;
let currentCall = null, currentRoomId = null;
let currentRemoteUserId = null, currentRemoteUsername = null, currentRemoteFullUid = null;
let sessionCount = 0, userXp = 10;
let listenerAttivi = [];
let ultimoMsgVistoId = "";
try { ultimoMsgVistoId = localStorage.getItem('alba_seen_broadcast') || ""; } catch (e) {}

const SCHERMATE = ["login-screen", "chat-screen", "admin-panel-screen", "info-screen", "faq-screen", "account-screen", "maintenance-screen"];

// ---------- Sessione / Autenticazione ----------
auth.onAuthStateChanged(function (u) {
  if (!u) {
    auth.signInAnonymously().catch(function (e) {
      console.error(e);
      alert("Errore di connessione al servizio. Riprova più tardi.");
    });
    return;
  }
  avviaSessione(u);
});

function avviaSessione(u) {
  const cambioUtente = userId !== null;
  listenerAttivi.forEach(function (r) { r.off(); });
  listenerAttivi = [];
  if (currentRoomId || currentCall) { terminaSessione(false); nascondiVideoRemoto(); }
  if (cambioUtente) nascondiTuttoTranne("login-screen");

  userId = u.uid;
  userUniqueId = u.uid.slice(0, 6);
  accountAttivo = !u.isAnonymous;
  nicknameUtente = "Ospite"; isAdmin = false; hasVoice = false; canBypassGps = false;
  aggiornaDisplayNickname();

  const on = function (ref, cb) { ref.on('value', cb); listenerAttivi.push(ref); };

  const pres = db.ref('presence/' + userId);
  pres.set(true);
  pres.onDisconnect().remove();

  on(db.ref('bans/' + userId), function (s) {
    if (s.val() === true) {
      if (myStream) myStream.getTracks().forEach(function (t) { t.stop(); });
      if (peer) peer.destroy();
      document.body.innerHTML = '<h2 style="padding:60px 20px;text-align:center;color:#fff;font-family:sans-serif">Accesso negato: il tuo account è stato bannato.</h2>';
    }
  });

  db.ref('admins/' + userId).once('value', function (s) { isAdmin = s.val() === true; aggiornaDisplayNickname(); });
  db.ref('privileges/' + userId).once('value', function (s) {
    const p = s.val() || {};
    hasVoice = p.voice === true;
    canBypassGps = p.gpsBypass === true;
    aggiornaDisplayNickname();
  });

  if (accountAttivo) {
    on(db.ref('profiles/' + userId), function (s) {
      const p = s.val();
      if (!p) return;   // profilo non ancora creato (registrazione in corso)
      if (p.blocked === true) { alert("Il tuo account è stato bloccato dall'amministratore."); auth.signOut(); return; }
      nicknameUtente = p.nickname;
      aggiornaDisplayNickname();
    });
  }

  on(db.ref('system/broadcast'), function (s) {
    const data = s.val();
    const modal = document.getElementById("broadcastModal");
    if (!data || !data.text || data.id === ultimoMsgVistoId) { modal.style.display = "none"; return; }
    document.getElementById("broadcastTextDisplay").textContent = data.text;
    modal.style.display = "flex";
    window.currentBroadcastId = data.id;
  });

  on(db.ref('system/maintenance'), function (s) {
    const ms = document.getElementById("maintenance-screen");
    if (s.val()) {
      SCHERMATE.forEach(function (id) { document.getElementById(id).style.display = "none"; });
      ms.style.display = "block";
    } else if (ms.style.display === "block") {
      ms.style.display = "none";
      document.getElementById("login-screen").style.display = "block";
    }
  });
}

function aggiornaDisplayNickname() {
  const reg = accountAttivo && nicknameUtente !== "Ospite";
  document.getElementById("activeNicknameDisplay").textContent =
    reg ? nicknameUtente + " (Account Verificato)" : "Ospite (Crea un account per bloccare il nickname)";
  document.getElementById("menuAccountStatus").textContent = reg ? nicknameUtente : "Ospite";
  document.getElementById("logoutAccountBtn").style.display = reg ? "block" : "none";
  document.getElementById("voiceEffectContainer").style.display = hasVoice ? "block" : "none";
  document.getElementById("adminMenuItem").style.display = isAdmin ? "block" : "none";
  document.getElementById("localVideoLabel").textContent = nicknameUtente + " (Tu)";
}

function chiudiBroadcastModal() {
  if (window.currentBroadcastId) {
    ultimoMsgVistoId = window.currentBroadcastId;
    try { localStorage.setItem('alba_seen_broadcast', ultimoMsgVistoId); } catch (e) {}
  }
  document.getElementById("broadcastModal").style.display = "none";
}

// ---------- Account (Firebase Authentication) ----------
function emailDa(username) { return username.toLowerCase() + "@utenti.albacorelive.app"; }

function gestisciInvioAccount() {
  const mode = document.getElementById("accountModeSelect").value;
  const username = document.getElementById("accountUser").value.trim();
  const pass = document.getElementById("accountPass").value;
  const errEl = document.getElementById("account-error");
  errEl.textContent = "";

  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) { errEl.textContent = "Nome utente: 3-20 caratteri, solo lettere, numeri e _."; return; }
  if (pass.length < 8) { errEl.textContent = "La password deve avere almeno 8 caratteri."; return; }

  if (mode === 'register') {
    auth.createUserWithEmailAndPassword(emailDa(username), pass).then(function (cred) {
      return db.ref('profiles/' + cred.user.uid).set({ nickname: username, blocked: false });
    }).then(function () {
      nicknameUtente = username;
      accountAttivo = true;
      aggiornaDisplayNickname();
      alert("Registrazione completata!");
      tornaAllaHomeDaAccount();
    }).catch(function (e) {
      errEl.textContent = e.code === 'auth/email-already-in-use' ? "Nome utente già registrato. Scegline un altro." : "Errore durante la registrazione.";
    });
  } else {
    auth.signInWithEmailAndPassword(emailDa(username), pass).then(function () {
      tornaAllaHomeDaAccount();
    }).catch(function () {
      errEl.textContent = "Nome utente o password errati.";
    });
  }
}

function eseguiLogoutAccount() {
  auth.signOut().then(function () { tornaAllaHomeDaAccount(); });
}

// ---------- GPS (nessun bypass pubblico: solo chi ha il permesso dal database) ----------
function avviaVerificaGPS() {
  const errDiv = document.getElementById("geo-error");
  if (canBypassGps) { errDiv.textContent = ""; entraNellaChat(); return; }

  errDiv.textContent = "Verifica della posizione GPS in corso...";
  if (!("geolocation" in navigator)) { errDiv.textContent = "La geolocalizzazione non è supportata dal tuo browser."; return; }

  navigator.geolocation.getCurrentPosition(
    function (pos) {
      const d = calcolaDistanza(pos.coords.latitude, pos.coords.longitude, 44.7035, 8.0357);
      if (d <= 50) { errDiv.textContent = ""; entraNellaChat(); }
      else errDiv.textContent = "Accesso negato: devi trovarti entro 50 km dal Duomo di Alba (rilevati " + Math.round(d) + " km).";
    },
    function () { errDiv.textContent = "Impossibile rilevare la posizione. Consenti l'accesso alla geolocalizzazione."; },
    { timeout: 15000, enableHighAccuracy: true, maximumAge: 10000 }
  );
}

// ---------- Segnalazioni ----------
function inviaSegnalazioneEffettiva(motivo) {
  db.ref('reports').push().set({
    timestamp: new Date().toLocaleString(),
    reportedUser: currentRemoteUsername ? (currentRemoteUsername + " [" + (currentRemoteUserId || "?") + "]") : "Utente Sconosciuto",
    targetUid: currentRemoteFullUid || "ignoto",
    reason: String(motivo).slice(0, 300),
    reporter: nicknameUtente + " [" + userUniqueId + "]"
  }, function (err) {
    alert(err ? "Impossibile inviare la segnalazione." : "Segnalazione inviata con successo.");
  });
  chiudiReportModal();
  cercaAltroUtenteBtn();
}

// ---------- Pannello Admin (tutto con textContent: niente XSS) ----------
function riga(celle) {
  const tr = document.createElement('tr');
  celle.forEach(function (c) {
    const td = document.createElement('td');
    if (c instanceof Node) td.appendChild(c); else td.textContent = String(c == null ? "" : c);
    tr.appendChild(td);
  });
  return tr;
}

function bottone(testo, bg, fn) {
  const b = document.createElement('button');
  b.className = 'btn btn-dark';
  b.style.cssText = 'padding:4px 10px;font-size:0.8rem;margin-right:6px;background:' + bg;
  b.textContent = testo;
  b.onclick = fn;
  return b;
}

function gruppo() {
  const s = document.createElement('span');
  Array.prototype.forEach.call(arguments, function (b) { s.appendChild(b); });
  return s;
}

function riempiTabella(id, dati, colonne, vuoto, costruisci) {
  const tb = document.getElementById(id);
  tb.textContent = "";
  const voci = dati ? Object.entries(dati) : [];
  if (!voci.length) {
    const tr = riga([vuoto]);
    tr.firstChild.colSpan = colonne;
    tr.firstChild.style.textAlign = "center";
    tb.appendChild(tr);
    return;
  }
  voci.forEach(function (e) { tb.appendChild(riga(costruisci(e[0], e[1]))); });
}

function apriPannelloAdmin() {
  if (!isAdmin) { alert("Non autorizzato."); return; }
  nascondiTuttoTranne("admin-panel-screen");

  ['profiles', 'bans', 'reports', 'presence', 'queue', 'rooms', 'system/maintenance'].forEach(function (p) { db.ref(p).off(); });

  db.ref('profiles').on('value', function (s) {
    riempiTabella('usersTableBody', s.val(), 2, "Nessun account registrato.", function (uid, p) {
      const bloccato = p.blocked === true;
      return [
        (p.nickname || "?") + " — ID: " + uid,
        gruppo(
          bottone(bloccato ? 'Sblocca' : 'Blocca', bloccato ? '#4ade80' : '#ff9800', function () { db.ref('profiles/' + uid + '/blocked').set(!bloccato); }),
          bottone('Banna', '#e50914', function () { bannaUtente(uid); })
        )
      ];
    });
  });

  db.ref('bans').on('value', function (s) {
    riempiTabella('bansTableBody', s.val(), 2, "Nessun utente bannato.", function (uid) {
      return [uid, bottone('Rimuovi Ban', '#4ade80', function () { db.ref('bans/' + uid).remove(); })];
    });
  });

  db.ref('reports').on('value', function (s) {
    riempiTabella('reportsTableBody', s.val(), 4, "Nessuna segnalazione ricevuta.", function (k, r) {
      return [
        r.timestamp, r.reportedUser, r.reason || "Nessun motivo specificato",
        (r.targetUid && r.targetUid !== "ignoto") ? bottone('Banna', '#e50914', function () { bannaUtente(r.targetUid); }) : ""
      ];
    });
  });

  db.ref('system/maintenance').on('value', function (s) {
    const btn = document.getElementById("killSwitchBtn");
    if (s.val()) { btn.textContent = "Riattiva Sito (Online)"; btn.style.background = "#4ade80"; }
    else { btn.textContent = "Disattiva Sito (Manutenzione)"; btn.style.background = "linear-gradient(135deg, var(--primary), var(--primary-2))"; }
  });

  db.ref('presence').on('value', function (s) { document.getElementById("statOnlineUsers").textContent = s.val() ? Object.keys(s.val()).length : 0; });
  db.ref('queue').on('value', function (s) { document.getElementById("statQueueUsers").textContent = s.val() ? Object.keys(s.val()).length : 0; });
  db.ref('rooms').on('value', function (s) {
    const d = s.val();
    document.getElementById("statActiveRooms").textContent = d ? Object.values(d).filter(function (r) { return r && r.info; }).length : 0;
  });
}

function toggleKillSwitch() {
  db.ref('system/maintenance').once('value', function (s) { db.ref('system/maintenance').set(!(s.val() || false)); });
}

function inviaBroadcast() {
  const text = document.getElementById("broadcastText").value.trim();
  if (!text) { alert("Inserisci il testo del messaggio."); return; }
  if (text.length > 300) { alert("Massimo 300 caratteri."); return; }
  db.ref('system/broadcast').set({ id: 'msg_' + Date.now(), text: text }, function (err) {
    if (!err) { alert("Messaggio inviato a tutti gli utenti!"); document.getElementById("broadcastText").value = ""; }
  });
}

function rimuoviBroadcast() {
  db.ref('system/broadcast').remove(function (err) {
    if (!err) { alert("Messaggio rimosso."); document.getElementById("broadcastModal").style.display = "none"; }
  });
}

function bannaUtente(uid) {
  if (confirm("Vuoi bannare permanentemente l'utente " + uid + "?")) db.ref('bans/' + uid).set(true);
}

function confermaEliminaTutteSegnalazioni() {
  if (confirm("Sei sicuro di voler eliminare tutte le segnalazioni?")) db.ref('reports').remove();
}
